version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docuflow_db
    restart: always
    environment:
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: docuflow_pass
      POSTGRES_DB: docuflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: docuflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuflow_api
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://docuflow:docuflow_pass@db:5432/docuflow_db
      - SYNC_DATABASE_URL=postgresql://docuflow:docuflow_pass@db:5432/docuflow_db
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuflow_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://docuflow:docuflow_pass@db:5432/docuflow_db
      - SYNC_DATABASE_URL=postgresql://docuflow:docuflow_pass@db:5432/docuflow_db
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      - db
      - redis
      - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docuflow_frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost:8000/api
    ports:
      - "5175:5175"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
